# Dedicated synthetic legal scanner. No TCP listener or source-storage mounts.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /run/legal-scanner/clamd.sock
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes
TemporaryDirectory /tmp
LogTime yes
LogClean no
LogVerbose no
MaxThreads 2
MaxQueue 8
ReadTimeout 30
CommandReadTimeout 5
SendBufTimeout 500
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
MaxRecursion 16
MaxFiles 2000
MaxScanTime 10000
AlertExceedsMax yes
AlertEncrypted yes
ScanArchive yes
ScanPDF yes
ScanXMLDOCS yes
ConcurrentDatabaseReload no
SelfCheck 60
